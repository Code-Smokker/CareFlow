  <script>
    (function() {
      const progressBar = document.getElementById('splash-progress-bar');
      const loadingText = document.getElementById('splash-loading-text');
      const startBtn = document.getElementById('start-journey-btn');

      function goToLanguage() {
        CareFlow.navigate('../careflow_language_selection/code.html', 'forward');
      }

      if (startBtn) {
        startBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          goToLanguage();
        });
      }

      // Animate progress smoothly from 28% -> 65% -> 100%
      setTimeout(() => {
        if (progressBar) progressBar.style.width = '68%';
        if (loadingText) loadingText.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-teal-primary animate-ping"></span><span>Preparing intake session...</span>';
      }, 700);

      setTimeout(() => {
        if (progressBar) progressBar.style.width = '100%';
        if (loadingText) loadingText.innerHTML = '<span class="text-teal-primary font-bold">✓ Ready!</span> <span>Starting CareFlow...</span>';
      }, 1500);

      // Auto advance or allow clicking container
      const timer = setTimeout(() => {
        goToLanguage();
      }, 2400);

      document.body.addEventListener('click', () => {
        clearTimeout(timer);
        goToLanguage();
      });
    })();
  </script>
</body></html>
