openapi: 3.1.0
info:
  title: CareFlow DocAI Service API
  version: 0.1.0
  description: >
    Internal — gateway → docai service. OCR, entity extraction, timeline. FastAPI + Celery.
    See docs/03-api-contracts.md. Handwritten OCR output is never auto-accepted (CLAUDE.md
    rule 5) — /process surfaces a dictionary-matched shortlist for a human to confirm.
servers:
  - url: http://localhost:8002
    description: Local docai service

paths:
  /classify:
    post:
      operationId: classifyDocument
      summary: Classify a captured image (prescription, lab report, etc.)
      tags: [classify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ref]
              properties:
                image_ref: { type: string }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                type: object
                required: [doc_type, confidence]
                properties:
                  doc_type:
                    type: string
                    enum: [prescription, lab_report, discharge_summary, other]
                  confidence: { type: number, minimum: 0, maximum: 1 }
        default: { $ref: "#/components/responses/Error" }

  /process:
    post:
      operationId: processDocument
      summary: Queue a document for OCR, extraction and timeline placement
      tags: [process]
      description: Long-running (Celery); result delivered via the document.processed WS event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, image_refs]
              properties:
                document_id: { type: string }
                image_refs:
                  type: array
                  items: { type: string }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getJob
      summary: Poll a processing job's status and result
      tags: [process]
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [queued, processing, done, failed]
                  result:
                    oneOf:
                      - $ref: "#/components/schemas/ProcessResult"
                      - type: "null"
        default: { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: [object, "null"]
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    BoundingBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }

    ExtractedField:
      type: object
      required:
        [
          field,
          value,
          confidence,
          bounding_box,
          needs_confirmation,
          dictionary_matches,
        ]
      properties:
        field: { type: string }
        value: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        bounding_box: { $ref: "#/components/schemas/BoundingBox" }
        needs_confirmation:
          type: boolean
          description: True for handwritten regions — never auto-accepted (CLAUDE.md rule 5).
        dictionary_matches:
          type: array
          items: { type: string }
          description: Dictionary-matched shortlist for the human to confirm against.

    TimelineEvent:
      type: object
      required: [event_id, occurred_at, kind, summary]
      properties:
        event_id: { type: string }
        occurred_at: { type: string, format: date-time }
        kind:
          {
            type: string,
            enum: [visit, prescription, lab_report, symptom_onset],
          }
        summary: { type: string }

    ProcessResult:
      type: object
      required: [document_id, extractions, timeline_events, quality_score]
      properties:
        document_id: { type: string }
        extractions:
          type: array
          items: { $ref: "#/components/schemas/ExtractedField" }
        timeline_events:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
        quality_score: { type: number, minimum: 0, maximum: 1 }
