openapi: 3.1.0
info:
  title: CareFlow DocAI Service API
  version: 0.1.0
  description: >
    Internal — gateway → docai service. OCR, entity extraction, timeline. FastAPI + Celery.
    See docs/03-api-contracts.md. Handwritten OCR output is never auto-accepted (CLAUDE.md
    rule 5) — /process surfaces a dictionary-matched shortlist for a human to confirm.
servers:
  - url: http://localhost:8002
    description: Local docai service

paths:
  /classify:
    post:
      operationId: classifyDocument
      summary: Classify a captured image (prescription, lab report, etc.)
      tags: [classify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ref]
              properties:
                image_ref: { type: string }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                type: object
                required: [doc_type, confidence]
                properties:
                  doc_type:
                    type: string
                    enum: [prescription, lab_report, discharge_summary, other]
                  confidence: { type: number, minimum: 0, maximum: 1 }
        default: { $ref: "#/components/responses/Error" }

  /process:
    post:
      operationId: processDocument
      summary: Queue a document for OCR, extraction and timeline placement
      tags: [process]
      description: Long-running (Celery); result delivered via the document.processed WS event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, image_refs]
              properties:
                document_id: { type: string }
                image_refs:
                  type: array
                  items: { type: string }
                doc_type:
                  type: [string, "null"]
                  enum: [prescription, lab_report, discharge_summary, other, null]
                  description: >
                    From a prior /classify call, if the caller already has one — used to pick
                    the TimelineEvent.kind for this document. Optional: omitted or null falls
                    back to a generic "visit" kind rather than blocking processing on it.
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getJob
      summary: Poll a processing job's status and result
      tags: [process]
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [queued, processing, done, failed]
                  result:
                    oneOf:
                      - $ref: "#/components/schemas/ProcessResult"
                      - type: "null"
        default: { $ref: "#/components/responses/Error" }

  /dictionary/search:
    get:
      operationId: searchDictionary
      summary: Fuzzy-match a term against the seeded dictionaries (allopathic brands, AYUSH
        classical formulations, Ayurvedic plants)
      tags: [dictionary]
      description: >
        pg_trgm similarity search over dictionary_entry. Backs the confirm-one-of-N shortlist
        CLAUDE.md rule 5 requires for handwritten OCR output.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: system
          in: query
          required: false
          schema:
            type: string
            enum: [allopathic, ayush_formulation, ayush_plant]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Ranked matches
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/DictionaryMatch" }
        default: { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: [object, "null"]
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    BoundingBox:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }

    ExtractedField:
      type: object
      required:
        [
          field,
          value,
          confidence,
          bounding_box,
          needs_confirmation,
          dictionary_matches,
          matched_dictionary,
        ]
      properties:
        field: { type: string }
        value: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        bounding_box: { $ref: "#/components/schemas/BoundingBox" }
        needs_confirmation:
          type: boolean
          description: True for handwritten regions — never auto-accepted (CLAUDE.md rule 5).
        dictionary_matches:
          type: array
          items: { type: string }
          description: Dictionary-matched shortlist for the human to confirm against.
        matched_dictionary:
          type: [string, "null"]
          description: >
            Which dictionary produced `dictionary_matches`, for a medication-like field —
            "ayush_formulation", "ayush_plant" or "allopathic". Null for non-medication fields
            and for a medication span that matched no dictionary at all (CLAUDE.md rule 4:
            provenance on every stored fact; never silently guess which system a span belongs
            to — the AYUSH labelling fix, docs/15-ai-stack.md, made this the thing the pipeline
            decides system from, not GLiNER's own zero-shot label).

    TimelineEvent:
      type: object
      required: [event_id, occurred_at, kind, summary, approximate]
      properties:
        event_id: { type: string }
        occurred_at: { type: string, format: date-time }
        kind:
          {
            type: string,
            enum: [visit, prescription, lab_report, symptom_onset],
          }
        summary: { type: string }
        approximate:
          type: boolean
          description: >
            True when occurred_at is a relative-ordering placeholder, not a date read from the
            document (docs/06-document-ai.md timeline assembly rule 3 — never invent a precise
            date; an approximate marker is the honest alternative). Required, not optional, so
            no caller can silently omit the honesty signal.

    DictionaryMatch:
      type: object
      required: [id, system, canonical_name, synonyms, score]
      properties:
        id: { type: string }
        system:
          type: string
          enum: [allopathic, ayush_formulation, ayush_plant]
        canonical_name: { type: string }
        synonyms:
          type: array
          items: { type: string }
        metadata:
          type: [object, "null"]
          additionalProperties: true
        score: { type: number, minimum: 0, maximum: 1 }

    ProcessResult:
      type: object
      required: [document_id, extractions, timeline_events, quality_score]
      properties:
        document_id: { type: string }
        extractions:
          type: array
          items: { $ref: "#/components/schemas/ExtractedField" }
        timeline_events:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
        quality_score: { type: number, minimum: 0, maximum: 1 }
