openapi: 3.1.0
info:
  title: CareFlow Gateway API
  version: 0.1.0
  description: >
    Everything the four clients (intake PWA, clinician console, triage board, admin) call.
    NestJS gateway. See docs/03-api-contracts.md — this spec is generated from that doc and
    must stay in sync with it. Additive changes only once Day 1 ships (docs/03-api-contracts.md
    rule 1).
servers:
  - url: http://localhost:4000
    description: Local gateway

paths:
  /v1/sessions:
    post:
      operationId: createSession
      summary: Start a new intake session
      tags: [sessions]
      description: >
        `department` is set by staff (the check-in URL / QR a desk or kiosk is configured with),
        never chosen by the patient. AYUSH mode is a property of the department, read from the
        gateway's visit config (`AYUSH_DEPARTMENTS`): an AYUSH department runs the complaint
        module and then the Prashna modules under packages/ontology/modules/ayush/.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                department:
                  type: string
                  pattern: "^[a-z][a-z0-9_-]{0,31}$"
                  description: Defaults to `general`.
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                required: [session_id, resume_token, qr_url, department, ayush_mode]
                properties:
                  session_id: { $ref: "#/components/schemas/SessionId" }
                  resume_token: { type: string }
                  qr_url: { type: string, format: uri }
                  department: { type: string }
                  ayush_mode: { type: boolean }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    get:
      operationId: getSession
      summary: Full session state and progress
      tags: [sessions]
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSession
      summary: Purge a session (patient-initiated withdrawal)
      tags: [sessions]
      responses:
        "204": { description: Purged }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: resumeSession
      summary: Rebind a session to a new device
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_token]
              properties:
                resume_token: { type: string }
      responses:
        "200":
          description: Session rebound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/language:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: setSessionLanguage
      summary: Set the patient's language for this session
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  type: string
                  description: BCP-47 language tag, e.g. "hi", "hi-Latn"
      responses:
        "204": { description: Language set }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/consent:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: recordConsent
      summary: Record patient consent scopes (Kavach)
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/ConsentScope" }
                audio_uri:
                  type: [string, "null"]
                  format: uri
                  description: Recorded verbal consent, when voice consent was used
      responses:
        "204": { description: Consent recorded }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/consent/resource:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    get:
      operationId: getConsentResource
      summary: FHIR Consent resource assembled from this session's recorded consent rows
      tags: [sessions]
      responses:
        "200":
          description: FHIR R4 Consent resource
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: FHIR R4 Consent resource. Typed via packages/fhir, not here.
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/consent/revoke:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: revokeConsent
      summary: Revoke one or more previously granted consent scopes (Kavach) — recorded as a
        revocation event, never a deletion; use DELETE /v1/sessions/:id to erase entirely.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/ConsentScope" }
      responses:
        "204": { description: Scopes revoked }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: submitAnswer
      summary: >
        Submit an answer to the current slot and receive the next question in the same
        response. Hot path — must not require a second round trip (p95 budget 1.2s,
        docs/03-api-contracts.md).
      tags: [sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnswerSubmission" }
      responses:
        "200":
          description: Next question, progress and any red flags fired by this answer
          content:
            application/json:
              schema:
                type: object
                required: [next_question, progress, red_flags]
                properties:
                  next_question: { $ref: "#/components/schemas/NextQuestion" }
                  progress: { $ref: "#/components/schemas/Progress" }
                  red_flags:
                    type: array
                    items: { $ref: "#/components/schemas/RedFlag" }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: completeSession
      summary: Close the interview and trigger summarisation
      tags: [sessions]
      responses:
        "200":
          description: Summary generated
          content:
            application/json:
              schema:
                type: object
                required: [summary_id]
                properties:
                  summary_id: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/identity/abha/qr:
    post:
      operationId: identifyByAbhaQr
      summary: Resolve patient identity from a scanned ABHA QR payload
      tags: [identity]
      description: Served by the mock gateway when ABDM_MODE=mock; identical response shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_payload]
              properties:
                qr_payload: { type: string }
      responses:
        "200":
          description: Patient identified
          content:
            application/json:
              schema:
                type: object
                required: [patient_id, demographics]
                properties:
                  patient_id: { type: string }
                  demographics: { $ref: "#/components/schemas/Demographics" }
        default: { $ref: "#/components/responses/Error" }

  /v1/identity/abha/otp/request:
    post:
      operationId: requestAbhaOtp
      summary: Request an OTP against an ABHA number or mobile number
      tags: [identity]
      description: Served by the mock gateway when ABDM_MODE=mock; identical response shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                abha_number: { type: [string, "null"] }
                mobile: { type: [string, "null"] }
              description: Exactly one of abha_number or mobile must be set.
      responses:
        "200":
          description: OTP dispatched
          content:
            application/json:
              schema:
                type: object
                required: [txn_id]
                properties:
                  txn_id: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/identity/abha/otp/verify:
    post:
      operationId: verifyAbhaOtp
      summary: Verify an OTP and receive a patient token
      tags: [identity]
      description: Served by the mock gateway when ABDM_MODE=mock; identical response shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txn_id, otp]
              properties:
                txn_id: { type: string }
                otp: { type: string }
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                required: [patient_id, token]
                properties:
                  patient_id: { type: string }
                  token: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/identity/register:
    post:
      operationId: registerPatient
      summary: Register a patient without ABHA (walk-in fallback)
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, age, sex]
              properties:
                name: { type: string }
                age: { type: integer, minimum: 0 }
                sex: { $ref: "#/components/schemas/Sex" }
                phone: { type: [string, "null"] }
      responses:
        "201":
          description: Patient registered
          content:
            application/json:
              schema:
                type: object
                required: [patient_id]
                properties:
                  patient_id: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/documents:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    post:
      operationId: uploadDocument
      summary: Upload a scanned prescription or lab report for this session
      tags: [documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentEncoding: base64
                  contentMediaType: image/jpeg
                doc_type_hint: { type: [string, "null"] }
      responses:
        "202":
          description: Queued for docai processing; result arrives via document.processed
          content:
            application/json:
              schema:
                type: object
                required: [document_id, status]
                properties:
                  document_id: { type: string }
                  status: { type: string, const: queued }
        default: { $ref: "#/components/responses/Error" }

  /v1/documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDocument
      summary: Document processing status and extractions
      tags: [documents]
      responses:
        "200":
          description: Document status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentStatus" }
        default: { $ref: "#/components/responses/Error" }

  /v1/sessions/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/SessionIdParam"
    get:
      operationId: getSessionTimeline
      summary: Chronologically ordered clinical events for this session
      tags: [documents]
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimelineEvent" }
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/queue:
    get:
      operationId: getVisitQueue
      summary: Prioritised token queue (Nadi)
      tags: [clinician]
      parameters:
        - name: department
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueueToken" }
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/{id}/summary:
    parameters:
      - $ref: "#/components/parameters/VisitIdParam"
    get:
      operationId: getVisitSummary
      summary: Structured summary with provenance on every field (Saar)
      tags: [clinician]
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitSummary" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: editVisitSummary
      summary: Physician edit to a single summary field
      tags: [clinician]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field_path, value]
              properties:
                field_path: { type: string }
                value: {}
      responses:
        "200":
          description: Updated summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitSummary" }
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/{id}/sign:
    parameters:
      - $ref: "#/components/parameters/VisitIdParam"
    post:
      operationId: signVisit
      summary: Physician sign-off; assembles the FHIR bundle (Setu)
      tags: [clinician]
      description: >
        No RBAC/auth exists yet (Day 4), so `signed_by` is a plain identifier passed by the
        caller rather than read from a session — additive until real auth lands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signed_by]
              properties:
                signed_by: { type: string }
      responses:
        "200":
          description: Signed
          content:
            application/json:
              schema:
                type: object
                required: [fhir_bundle_id, abdm_status, care_context_status]
                properties:
                  fhir_bundle_id: { type: string }
                  abdm_status: { $ref: "#/components/schemas/AbdmStatus" }
                  care_context_status:
                    type: string
                    description: >
                      Verbatim UI-facing string — under ABDM_MODE=mock this is always
                      "linked (mock)", never a fake "linked" success (docs/08-abdm-fhir.md).
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/{id}/printable-summary:
    parameters:
      - $ref: "#/components/parameters/VisitIdParam"
    get:
      operationId: getPrintableSummary
      summary: Server-rendered printable HTML summary with a QR code, for hospitals that
        cannot integrate electronically (docs/14-features.md section 7 "Printable fallback")
      tags: [clinician]
      description: Only available once the visit's summary is signed.
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/{id}/ask:
    parameters:
      - $ref: "#/components/parameters/VisitIdParam"
    post:
      operationId: askVisit
      summary: Grounded question over this visit's structured data
      tags: [clinician]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        "200":
          description: Grounded answer with cited field ids
          content:
            application/json:
              schema:
                type: object
                required: [answer, cited_field_paths]
                properties:
                  answer: { type: string }
                  cited_field_paths:
                    type: array
                    items: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/{id}/diff:
    parameters:
      - $ref: "#/components/parameters/VisitIdParam"
    get:
      operationId: getVisitDiff
      summary: Follow-up delta vs the previous visit
      tags: [clinician]
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitDiff" }
        default: { $ref: "#/components/responses/Error" }

  /v1/ayurveda/vocabulary:
    get:
      operationId: getAyurvedaVocabulary
      summary: The Pariksha vocabulary — every examination field and option
      tags: [clinician]
      description: >
        Serves packages/ontology/modules/ayush/pariksha-vocabulary.yaml. UI and API read
        options only from here; no component hardcodes one. `status` is PENDING_EXPERT_REVIEW
        until an Ayurveda practitioner has verified the file — clients must show that.
      responses:
        "200":
          description: Vocabulary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AyurvedaVocabulary" }
        default: { $ref: "#/components/responses/Error" }

  /v1/visits/{id}/ayurveda:
    parameters:
      - $ref: "#/components/parameters/VisitIdParam"
    get:
      operationId: getAyurvedaRecord
      summary: Ayurvedic case record — Prashna answers and every examination field
      tags: [clinician]
      description: >
        Prashna is composed live from the patient's intake answers (with provenance and
        confidence) and is read-only. Everything the Vaidya recorded is returned beside the
        patient-reported reference values. CareFlow never computes or suggests Vikriti,
        Samprapti or a diagnosis — `computed` carries only BMI and the Vaya band, both pure
        arithmetic over fields the Vaidya entered.
      responses:
        "200":
          description: Case record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AyurvedaRecord" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: saveAyurvedaExam
      summary: Save examination fields (partial saves allowed)
      tags: [clinician]
      description: >
        Only fields present in the request are touched. A `null` value clears a field. For a
        field the patient answered (a `patient_reference` with a `map` in the vocabulary), the
        server decides the disposition: the patient's mapped value → `confirmed`; any other
        value → `overridden`, and the original patient value is kept beside it. Every save
        writes one row to the append-only audit log. A signed visit rejects saves (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recorded_by, fields]
              properties:
                recorded_by:
                  type: string
                  minLength: 1
                  description: Same identifier convention as `signed_by` — no RBAC until Day 4.
                fields:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [field_id, value]
                    properties:
                      field_id: { type: string }
                      value:
                        description: Type depends on the field — see the vocabulary. `null` clears.
      responses:
        "200":
          description: Updated case record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AyurvedaRecord" }
        default: { $ref: "#/components/responses/Error" }

  /v1/terminology/search:
    get:
      operationId: searchTerminology
      summary: Search NAMASTE / ICD-11 concepts (proxied to the terminology service)
      tags: [clinician]
      description: >
        Lets a browser client reach the terminology service through the gateway (the terminology
        service has no browser CORS of its own). Results carry a relevance `score`; clients
        picking a diagnosis must NOT rank or suggest by it (CLAUDE.md rule 2) — list
        alphabetically and let the Vaidya pick. 502 when the terminology service is unreachable.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - name: system
          in: query
          required: false
          schema: { type: string, enum: [namaste, icd11-tm2, icd11-bio], default: namaste }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [system, code, display, score]
                  properties:
                    system: { type: string, enum: [namaste, icd11-tm2, icd11-bio] }
                    code: { type: string }
                    display: { type: string }
                    score: { type: number }
        default: { $ref: "#/components/responses/Error" }

  /v1/terminology/translate:
    post:
      operationId: translateTerminology
      summary: Crosswalk a concept, e.g. NAMASTE to ICD-11 TM2
      tags: [clinician]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [system, code, target]
              properties:
                system: { type: string, enum: [namaste, icd11-tm2, icd11-bio] }
                code: { type: string }
                target: { type: string, enum: [namaste, icd11-tm2, icd11-bio] }
      responses:
        "200":
          description: "Match, or matched=false when no mapping exists (never a fabricated target)"
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched: { type: boolean }
                  equivalence: { type: [string, "null"] }
                  target_system: { type: string }
                  target_code: { type: [string, "null"] }
                  target_display: { type: [string, "null"] }
                  reviewed_by: { type: [string, "null"] }
                  provenance: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /v1/redflags/{id}/acknowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeRedFlag
      summary: One-tap acknowledge, logged with who and when
      tags: [triage]
      description: >
        No RBAC/auth exists yet (Day 4), so actor_id/actor_role are plain identifiers passed
        by the caller — same pattern as POST /v1/visits/{id}/sign's signed_by. Acknowledging
        also writes an audit_log row (genuinely append-only, DB-trigger-enforced).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actor_id, actor_role]
              properties:
                actor_id: { type: string }
                actor_role: { type: string }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedFlag" }
        default: { $ref: "#/components/responses/Error" }

  /v1/audit-log:
    get:
      operationId: getAuditLog
      summary: Append-only audit log — DPDP compliance evidence
      tags: [audit]
      description: >
        Every row here was written by application code that never updates or deletes one
        (services/gateway/prisma/schema.prisma's AuditLog model) — enforced by a Postgres
        trigger, not just convention (audit_log_no_update / audit_log_no_delete,
        prisma/migrations/20260906055251_init). `integrity` reports what this endpoint itself
        just verified by querying pg_trigger, live, on this call — not a stored or asserted
        claim.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          description: Opaque, from a previous response's `next_cursor`. Omit for the first page.
          schema: { type: string }
        - name: resource
          in: query
          required: false
          description: Filter to one resource type, e.g. "red_flag", "intake_session".
          schema: { type: string }
        - name: action
          in: query
          required: false
          description: Filter to one action, e.g. "redflag.acknowledge".
          schema: { type: string }
      responses:
        "200":
          description: A page of audit log entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [entries, next_cursor, integrity]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLogEntry" }
                  next_cursor: { type: [string, "null"] }
                  integrity: { $ref: "#/components/schemas/AuditIntegrity" }
        default: { $ref: "#/components/responses/Error" }

  /v1/integration-events:
    get:
      operationId: getIntegrationEvents
      summary: Provider cascade events — hosted tier tried, failed, local tier served the request
      tags: [integrations]
      description: >
        One row per tier attempted by services/ai's or services/docai's cascade() helper
        (docs/15-ai-stack.md), success or failure — this is CLAUDE.md rule 9 ("every external
        dependency has a local fallback") as something that happened, not an eval-report claim.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: outcome
          in: query
          required: false
          schema: { type: string, enum: [success, failure] }
        - name: capability
          in: query
          required: false
          description: e.g. "llm.fill_slot", "asr.transcribe", "tts.synthesise", "docai.ocr".
          schema: { type: string }
      responses:
        "200":
          description: A page of provider cascade events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [entries, next_cursor]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/IntegrationEvent" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Error" }

  /v1/analytics/summary:
    get:
      operationId: getAnalyticsSummary
      summary: OPD throughput, top complaints, red-flag rate, average intake time
      tags: [analytics]
      description: >
        Aggregate queries over Visit/RedFlag/IntakeSession/Summary — no new data, no separate
        analytics store. `window_start`/`window_end` default to the current day.
      parameters:
        - name: since
          in: query
          required: false
          description: ISO 8601 datetime. Defaults to the start of today (server timezone).
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Aggregate stats for the window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalyticsSummary" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    SessionIdParam:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SessionId" }
    VisitIdParam:
      name: id
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Required on POST /answer. Flaky hospital wifi means retries; a duplicated answer must
        not advance the interview twice (docs/03-api-contracts.md rule 4).
      schema: { type: string }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    SessionId:
      type: string
      description: Opaque session identifier.

    Sex:
      type: string
      enum: [male, female, other, unknown]

    InputMode:
      type: string
      description: How the patient supplied this answer. Maps to answer.source (CLAUDE.md rule 4).
      enum: [voice, tap, bodymap, proxy, ocr]

    QuestionInputMode:
      type: string
      description: >
        UI affordances a question can be answered with — packages/ontology slot.input, not the
        answer-provenance InputMode. Every slot supports at least two, none requires typing
        (docs/05-interview-engine.md).
      enum: [voice, chips, multi, bodymap, facescale, duration]

    ConsentScope:
      type: string
      enum:
        [
          history,
          audio_recording,
          documents,
          abha_lookup,
          research_deidentified,
        ]

    AbdmStatus:
      type: string
      enum: [mocked, submitted, acknowledged, failed]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
        details:
          type: [object, "null"]
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/Error" }

    Progress:
      type: object
      required: [module_id, completed_slots, total_slots, percent]
      properties:
        module_id: { type: string }
        completed_slots: { type: integer, minimum: 0 }
        total_slots: { type: integer, minimum: 0 }
        percent: { type: number, minimum: 0, maximum: 100 }

    QuestionOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        icon: { type: [string, "null"] }

    NextQuestion:
      type: object
      required: [slot_id, text, tts_url, input_modes, options]
      properties:
        slot_id: { type: [string, "null"] }
        text: { type: string }
        tts_url: { type: [string, "null"], format: uri }
        input_modes:
          type: array
          items: { $ref: "#/components/schemas/QuestionInputMode" }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuestionOption" }

    AnswerValue:
      description: Typed per the slot schema declared in packages/ontology.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items: { type: string }
        - type: object
          additionalProperties: true

    AnswerSubmission:
      type: object
      required: [slot_id, value, input_mode]
      properties:
        slot_id: { type: string }
        value: { $ref: "#/components/schemas/AnswerValue" }
        input_mode: { $ref: "#/components/schemas/InputMode" }
        confidence:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        audio_uri:
          type: [string, "null"]
          format: uri

    RedFlag:
      type: object
      required: [id, rule_id, severity, quote, token_no]
      properties:
        id:
          {
            type: string,
            description: "The fired red_flag row's id — acknowledge it via POST /v1/redflags/{id}/acknowledge.",
          }
        rule_id: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        quote: { type: string }
        token_no: { type: string }
        acknowledged_by: { type: [string, "null"] }
        acknowledged_at: { type: [string, "null"], format: date-time }

    Session:
      type: object
      required: [session_id, status, language, progress, consent_scopes]
      properties:
        session_id: { $ref: "#/components/schemas/SessionId" }
        status:
          type: string
          enum: [created, in_progress, completed, withdrawn]
        language: { type: [string, "null"] }
        progress: { $ref: "#/components/schemas/Progress" }
        consent_scopes:
          type: array
          items: { $ref: "#/components/schemas/ConsentScope" }
        patient_id: { type: [string, "null"] }

    Demographics:
      type: object
      required: [name, age, sex]
      properties:
        name: { type: string }
        age: { type: integer, minimum: 0 }
        sex: { $ref: "#/components/schemas/Sex" }
        phone: { type: [string, "null"] }
        abha_address: { type: [string, "null"] }

    Extraction:
      type: object
      required: [field, value, confidence, bounding_box]
      properties:
        field: { type: string }
        value: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        bounding_box:
          type: [object, "null"]
          required: [x, y, width, height]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }

    DocumentStatus:
      type: object
      required: [status, extractions, quality_score]
      properties:
        status:
          type: string
          enum: [queued, processing, done, failed]
        extractions:
          type: array
          items: { $ref: "#/components/schemas/Extraction" }
        quality_score: { type: [number, "null"], minimum: 0, maximum: 1 }

    TimelineEvent:
      type: object
      required: [event_id, occurred_at, kind, summary, source_document_id]
      properties:
        event_id: { type: string }
        occurred_at: { type: string, format: date-time }
        kind:
          {
            type: string,
            enum: [visit, prescription, lab_report, symptom_onset],
          }
        summary: { type: string }
        source_document_id: { type: [string, "null"] }

    QueueToken:
      type: object
      required:
        [
          visit_id,
          token_no,
          patient_id,
          department,
          priority,
          waiting_minutes,
          red_flags,
        ]
      properties:
        visit_id: { type: string }
        token_no: { type: string }
        patient_id: { type: string }
        department: { type: string }
        priority: { type: string, enum: [routine, priority, urgent] }
        waiting_minutes: { type: number, minimum: 0 }
        red_flags:
          type: array
          items: { $ref: "#/components/schemas/RedFlag" }

    SummaryField:
      type: object
      required: [field_path, value, source, confidence, low_confidence]
      properties:
        field_path: { type: string }
        value: {}
        source: { $ref: "#/components/schemas/InputMode" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        audio_offset_ms: { type: [integer, "null"], minimum: 0 }
        bounding_box:
          type: [object, "null"]
          required: [x, y, width, height]
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
        physician_edited: { type: boolean, default: false }
        low_confidence:
          type: boolean
          description: >
            Never drop a low-confidence field, never guess — the UI demotes it, it doesn't
            hide it (CLAUDE.md rule 4, docs/05-interview-engine.md).

    VisitSummary:
      type: object
      required: [visit_id, session_id, fields, signed, red_flags]
      properties:
        visit_id: { type: string }
        session_id: { $ref: "#/components/schemas/SessionId" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/SummaryField" }
        signed: { type: boolean }
        red_flags:
          type: array
          description: >
            Unacknowledged red flags for this visit — a non-empty array is what the clinician
            console reads as "open this on the red banner" (docs/05-interview-engine.md); this
            is derived live from the red_flag table on every request, not a separate stamped
            flag that could drift out of sync with it.
          items: { $ref: "#/components/schemas/RedFlag" }
        ayurveda_sections:
          type: array
          description: >
            The Ayurvedic case sheet in PS 26047 order — Prashna, Trividha, Ashtavidha,
            Dashavidha, Vyadhi Vinishchaya — composed live from the patient's answers and the
            Vaidya's examination record. Empty for a visit with no Ayurvedic data.
          items: { $ref: "#/components/schemas/AyurvedicSection" }

    AyurvedaVocabulary:
      type: object
      required: [id, status, version, title, review, prashna, prakriti_scoring, steps, summary_step]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [PENDING_EXPERT_REVIEW, VERIFIED]
        version: { type: integer }
        title: { $ref: "#/components/schemas/VocabLabel" }
        review:
          type: object
          required: [status, note]
          properties:
            status: { type: string }
            note: { type: string }
            verified_by: { type: [string, "null"] }
        prashna:
          type: object
          required: [label, gloss, groups]
          properties:
            label: { type: string }
            gloss: { type: string }
            groups:
              type: array
              items:
                type: object
                required: [id, label, gloss, module]
                properties:
                  id: { type: string }
                  label: { type: string }
                  gloss: { type: string }
                  module:
                    type: [string, "null"]
                    description: Interview module id; null = the chief-complaint module the patient picked.
        prakriti_scoring:
          type: object
          required: [label, gloss, caveat, doshas, slots]
          properties:
            label: { type: string }
            gloss: { type: string }
            caveat: { type: string }
            doshas:
              type: array
              items:
                type: object
                required: [value, label]
                properties:
                  value: { type: string }
                  label: { type: string }
            slots:
              type: object
              description: slot id → (option value → dosha value)
              additionalProperties:
                type: object
                additionalProperties: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ExamStep" }
        summary_step: { $ref: "#/components/schemas/VocabLabelWithId" }

    VocabLabel:
      type: object
      required: [label, gloss]
      properties:
        label: { type: string, description: The Sanskrit term. }
        gloss: { type: string, description: Short English gloss. }

    VocabLabelWithId:
      type: object
      required: [id, label, gloss]
      properties:
        id: { type: string }
        label: { type: string }
        gloss: { type: string }

    ExamStep:
      type: object
      required: [id, label, gloss, sections]
      properties:
        id: { type: string }
        label: { type: string }
        gloss: { type: string }
        sections:
          type: array
          items: { $ref: "#/components/schemas/ExamSection" }

    ExamSection:
      type: object
      required: [id, label, gloss, fields]
      properties:
        id: { type: string }
        label: { type: string }
        gloss: { type: string }
        link_to_step:
          type: string
          description: This section is a pointer to another step, not a form.
        show_prakriti_score:
          type: boolean
          description: Show the patient's Prakriti questionnaire score beside this section, as reference only.
        fields:
          type: array
          items: { $ref: "#/components/schemas/ExamField" }

    ExamField:
      type: object
      required: [id, label, gloss, type]
      properties:
        id: { type: string, description: "Dotted, prefixed with its step id — e.g. ashtavidha.mala.nature." }
        label: { type: string }
        gloss: { type: string }
        type:
          type: string
          enum: [text, enum, enum_multi, number, computed, namaste_codes]
        required: { type: boolean }
        options:
          type: array
          items: { $ref: "#/components/schemas/VocabOption" }
        min: { type: number }
        max: { type: number }
        unit: { type: string }
        patient_reference:
          type: array
          items:
            type: object
            required: [slot]
            properties:
              slot: { type: string }
              map:
                type: object
                description: Patient option value → this field's option value. Present = offered as a pre-fill.
                additionalProperties: { type: string }
        computed:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [bmi, vaya_band] }
            height_field: { type: string }
            weight_field: { type: string }
            age_field: { type: string }
        source: { type: string, description: Classical source note for a computed field's cut-offs. }
        bands:
          type: array
          items:
            type: object
            required: [value, label, gloss, below_age_years]
            properties:
              value: { type: string }
              label: { type: string }
              gloss: { type: string }
              below_age_years: { type: [number, "null"], description: Exclusive upper bound; null = no upper bound. }
        namaste_code:
          type: [string, "null"]
          description: Verified NAMASTE code, if one exists. null → PLACEHOLDER in the FHIR bundle.

    VocabOption:
      type: object
      required: [value, label, gloss]
      properties:
        value: { type: string }
        label: { type: string }
        gloss: { type: string }

    AyurvedaRecord:
      type: object
      required: [visit_id, signed, department, ayush_mode, prashna, exam, patient_reference, computed, completion]
      properties:
        visit_id: { type: string }
        signed: { type: boolean }
        department: { type: [string, "null"] }
        ayush_mode: { type: boolean }
        prashna: { $ref: "#/components/schemas/PrashnaRecord" }
        exam:
          type: array
          items: { $ref: "#/components/schemas/ExamValue" }
        patient_reference:
          type: object
          description: Exam field id → what the patient reported that bears on it.
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/PrashnaItem" }
        computed:
          type: object
          required: [bmi, vaya]
          properties:
            bmi: { type: [number, "null"] }
            vaya:
              type: object
              required: [age_years, age_source, band]
              properties:
                age_years: { type: [integer, "null"] }
                age_source:
                  type: [string, "null"]
                  enum: [dob, clinician, null]
                band: { type: [string, "null"] }
        completion:
          type: array
          items:
            type: object
            required: [step_id, filled, required_total, status]
            properties:
              step_id: { type: string }
              filled: { type: integer }
              required_total: { type: integer }
              status: { type: string, enum: [not_started, in_progress, complete] }

    PrashnaRecord:
      type: object
      required: [groups, answered, total, prakriti_score]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [id, label, gloss, items]
            properties:
              id: { type: string }
              label: { type: string }
              gloss: { type: string }
              items:
                type: array
                items: { $ref: "#/components/schemas/PrashnaItem" }
        answered: { type: integer }
        total: { type: integer }
        prakriti_score:
          oneOf:
            - $ref: "#/components/schemas/PrakritiScore"
            - { type: "null" }

    PrashnaItem:
      type: object
      required: [slot_id, question, value, value_label, source, confidence, audio_offset_ms, suggested_value]
      properties:
        slot_id: { type: string }
        question: { type: string }
        value: {}
        value_label: { type: string, description: Human-readable label(s) of the answer, from the ontology option labels. }
        source:
          type: string
          enum: [voice, tap, bodymap, proxy, ocr]
        confidence: { type: number }
        audio_offset_ms: { type: [integer, "null"] }
        suggested_value:
          type: [string, "null"]
          description: The exam-field value the vocabulary maps this answer to (a pre-fill offer); null when reference only.

    PrakritiScore:
      type: object
      required: [label, gloss, caveat, counts, answered, total]
      description: >
        A count per dosha of the patient's questionnaire answers, REFERENCE only. There is
        deliberately no "dominant dosha" field — CareFlow never asserts a constitution.
      properties:
        label: { type: string }
        gloss: { type: string }
        caveat: { type: string }
        counts:
          type: array
          items:
            type: object
            required: [dosha, label, count]
            properties:
              dosha: { type: string }
              label: { type: string }
              count: { type: integer }
        answered: { type: integer }
        total: { type: integer }

    ExamValue:
      type: object
      required: [field_id, value, source, disposition, recorded_by, recorded_at, original]
      properties:
        field_id: { type: string }
        value: {}
        source:
          type: string
          enum: [clinician]
        disposition:
          type: string
          enum: [entered, confirmed, overridden]
          description: >
            entered = the Vaidya's own finding; confirmed = the Vaidya accepted the
            patient-reported value; overridden = the Vaidya replaced it (the original is kept).
        recorded_by: { type: string }
        recorded_at: { type: string, format: date-time }
        original:
          description: The patient-reported value this one confirms or overrides; never discarded.
          oneOf:
            - $ref: "#/components/schemas/ExamOriginal"
            - { type: "null" }

    ExamOriginal:
      type: object
      required: [value, value_label, source, confidence]
      properties:
        value: {}
        value_label: { type: string }
        source:
          type: string
          enum: [voice, tap, bodymap, proxy, ocr]
        confidence: { type: number }

    AyurvedicSection:
      type: object
      required: [id, label, gloss, rows]
      properties:
        id: { type: string }
        label: { type: string }
        gloss: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AyurvedicRow" }

    AyurvedicRow:
      type: object
      required: [group, label, gloss, value_label, source, confidence, disposition, original, recorded_by]
      properties:
        group: { type: [string, "null"], description: Sub-heading (e.g. "Nadi — Pulse"). }
        label: { type: string }
        gloss: { type: string }
        value_label: { type: string }
        source:
          type: string
          enum: [voice, tap, bodymap, proxy, ocr, clinician, computed]
        confidence: { type: [number, "null"] }
        disposition:
          type: [string, "null"]
          enum: [entered, confirmed, overridden, null]
        original:
          oneOf:
            - $ref: "#/components/schemas/ExamOriginal"
            - { type: "null" }
        recorded_by: { type: [string, "null"] }

    VisitDiff:
      type: object
      required: [previous_visit_id, changed_fields]
      properties:
        previous_visit_id: { type: [string, "null"] }
        changed_fields:
          type: array
          items:
            type: object
            required: [field_path, previous_value, current_value]
            properties:
              field_path: { type: string }
              previous_value: {}
              current_value: {}

    AuditLogEntry:
      type: object
      required: [id, action, resource, at]
      properties:
        id: { type: string }
        actor_id: { type: [string, "null"] }
        actor_role: { type: [string, "null"] }
        action: { type: string, description: "e.g. \"redflag.acknowledge\", \"session.withdraw\"" }
        resource: { type: string, description: "e.g. \"red_flag\", \"intake_session\"" }
        resource_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        at: { type: string, format: date-time }

    AuditIntegrity:
      type: object
      required: [enforced, triggers]
      description: >
        Live pg_trigger lookup against audit_log at request time — not a stored flag, so it
        cannot silently go stale if a migration ever removed the trigger.
      properties:
        enforced:
          type: boolean
          description: True only if both audit_log_no_update and audit_log_no_delete exist and are enabled.
        triggers:
          type: array
          items:
            type: object
            required: [name, enabled]
            properties:
              name: { type: string }
              enabled: { type: boolean }

    IntegrationEvent:
      type: object
      required: [id, service, capability, provider, outcome, latency_ms, at]
      properties:
        id: { type: string }
        service: { type: string, enum: [ai, docai] }
        capability: { type: string, description: "e.g. \"llm.fill_slot\", \"asr.transcribe\", \"docai.ocr\"" }
        provider: { type: string, description: "e.g. \"sarvam\", \"local\", \"hosted\"" }
        outcome: { type: string, enum: [success, failure] }
        latency_ms: { type: integer }
        error: { type: [string, "null"] }
        at: { type: string, format: date-time }

    AnalyticsSummary:
      type: object
      required:
        [
          window_start,
          window_end,
          opd_throughput,
          top_complaints,
          red_flag_rate,
          average_intake_seconds,
        ]
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        opd_throughput:
          type: integer
          description: Visits started within the window.
        top_complaints:
          type: array
          items:
            type: object
            required: [complaint, count]
            properties:
              complaint: { type: string }
              count: { type: integer }
        red_flag_rate:
          type: number
          minimum: 0
          maximum: 1
          description: Visits with at least one red flag, divided by opd_throughput. 0 if opd_throughput is 0.
        average_intake_seconds:
          type: [number, "null"]
          description: >
            Mean time from session creation to completion, for sessions completed within the
            window. Null if none completed yet — never a fabricated 0.
